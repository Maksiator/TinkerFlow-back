version: '3.8'

services:
  # 1. BAZA DANYCH
  db:
    image: postgres:15-alpine
    container_name: tinkerflow-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  # 2. BACKEND API
  api:
    image: ghcr.io/${GHCR_USERNAME}/tinkerflow-api:latest
    container_name: tinkerflow-api
    restart: always
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Key=${JWT_KEY}
      - Jwt__CookieSecure=${JWT_COOKIE_SECURE}
      - AllowedOrigins__0=${ALLOWED_ORIGINS}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
  
  # 3. FRONTEND
  frontend:
    image: ghcr.io/${GHCR_USERNAME}/tinkerflow-front:latest
    container_name: tinkerflow-front
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  pgdata:
